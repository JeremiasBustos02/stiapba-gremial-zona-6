spring:
  application:
    name: document-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${TEMPLATE_MAX_FILE_SIZE:10MB}
      max-request-size: ${TEMPLATE_MAX_FILE_SIZE:10MB}

server:
  port: ${PORT:8080}

app:
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:STIA PBA Zona 6}
  resend:
    api-key: ${RESEND_API_KEY:}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    initial-admin:
      dni: ${INITIAL_ADMIN_DNI:}
      password: ${INITIAL_ADMIN_PASSWORD:}
      name: ${INITIAL_ADMIN_NAME:}
      lastname: ${INITIAL_ADMIN_LASTNAME:}
  template:
    max-file-size-bytes: ${TEMPLATE_MAX_FILE_SIZE_BYTES:10485760}
    storage-type: ${TEMPLATE_STORAGE_TYPE:local}
    storage-path: ${TEMPLATE_STORAGE_PATH:storage/templates}
    seed-file: ${TEMPLATE_SEED_FILE:}
    acroform-seed-file: ${TEMPLATE_ACROFORM_SEED_FILE:}
    seed-enabled: ${TEMPLATE_SEED_ENABLED:true}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

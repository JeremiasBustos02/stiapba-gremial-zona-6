spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS}
    cookie:
      secure: true
      same-site: ${AUTH_COOKIE_SAME_SITE:None}
  template:
    storage-type: ${TEMPLATE_STORAGE_TYPE:s3}
    max-file-size-bytes: ${TEMPLATE_MAX_FILE_SIZE_BYTES:10485760}
    seed-enabled: ${TEMPLATE_SEED_ENABLED:true}
    seed-file: ${TEMPLATE_SEED_FILE:/app/seed/Permiso-Gremial-Bruna.pdf}
    acroform-seed-file: ${TEMPLATE_ACROFORM_SEED_FILE:/app/seed/Permiso-Gremial-Bruna-ACROFORM.pdf}

frontend:
  url: ${FRONTEND_URL}

logging:
  level:
    root: INFO
    org.springframework.web: WARN

spring:
  application:
    name: document-management

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: ${TEMPLATE_MAX_FILE_SIZE:10MB}
      max-request-size: ${TEMPLATE_MAX_FILE_SIZE:10MB}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS}
    cookie:
      secure: true
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

  template:
    storage-type: ${TEMPLATE_STORAGE_TYPE:s3}
    max-file-size-bytes: ${TEMPLATE_MAX_FILE_SIZE_BYTES:10485760}
    seed-enabled: ${TEMPLATE_SEED_ENABLED:true}
    seed-file: ${TEMPLATE_SEED_FILE:/app/seed/Permiso Gremial Bruna.pdf}
    acroform-seed-file: ${TEMPLATE_ACROFORM_SEED_FILE:}

frontend:
  url: ${FRONTEND_URL}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
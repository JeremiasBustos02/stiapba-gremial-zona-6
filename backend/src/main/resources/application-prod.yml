spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS}
    cookie:
      secure: true
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  template:
    storage-path: ${TEMPLATE_STORAGE_PATH}
    max-file-size-bytes: ${TEMPLATE_MAX_FILE_SIZE_BYTES:10485760}
    seed-enabled: ${TEMPLATE_SEED_ENABLED:true}
    seed-file: ${TEMPLATE_SEED_FILE:}

frontend:
  url: ${FRONTEND_URL}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
